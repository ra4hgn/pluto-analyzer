[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pluto-analyzer"
version = "0.1.0"
description = "Scalar S21 measurement with ADALM-PLUTO (AD9363, 70-6000 MHz)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Pluto S21 Analyzer contributors"}]
keywords = [
    "sdr",
    "plutosdr",
    "adalm-pluto",
    "network-analyzer",
    "vna",
    "s21",
    "rf",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pyqtgraph>=0.13",
    "PyQt6>=6.5",
    "pyadi-iio==0.0.21",
    "pylibiio==0.25",
]

[project.urls]
Homepage = "https://github.com/ra4hgn/pluto-analyzer"
Repository = "https://github.com/ra4hgn/pluto-analyzer"
Issues = "https://github.com/ra4hgn/pluto-analyzer/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pluto_analyzer.help" = ["*.md"]

[project.scripts]
pluto-na-cli = "pluto_analyzer.cli:main"
pluto-na = "pluto_analyzer.gui.main_window:main"
